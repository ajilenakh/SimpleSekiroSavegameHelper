name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore SimpleSekiroSavegameHelper.sln

      - name: Build (Release)
        run: msbuild SimpleSekiroSavegameHelper.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSekiroSavegameHelper-Release
          path: '**/bin/Release/**/*.exe'

      - name: Create GitHub Release (tagged only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/bin/Release/**/*.exe'
